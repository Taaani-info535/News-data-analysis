name: UAMIS collect prices
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Download maximum history (first run)"
        type: boolean
        default: false

permissions:
  contents: write
concurrency:
  group: uamis-state          # all jobs share one group: state is read-modify-write, so runs are serialised
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore state
        run: bash scripts/state_pull.sh
      - name: Run
        run: |
          python -m uamis collect ${{ inputs.backfill == true && '--backfill' || '' }}
      - name: Save state
        if: always()
        run: bash scripts/state_push.sh
